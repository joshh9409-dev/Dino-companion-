name: Dino Companion v1.37 Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract and patch project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'DinoCompanion*.zip' -printf '%f
' | sort -V | tail -n 1)
          test -n "$ZIP_FILE"
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md BUILD_VERSION.txt
          unzip -o "$ZIP_FILE" -d .
          python3 patch_v1_37.py
          rm -f app/src/main/res/layout/activity_main.xml
      - name: Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace
      - name: Upload v1.37 APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-v1.37-debug
          path: app/build/outputs/apk/debug/*.apk
