name: Build Dino Companion Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract fixed project
        run: |
          unzip -o DinoCompanion-Fixed-Project.zip -d .
          echo "Project extracted"
          ls -la
          ls -la app

      - name: Configure Gradle
        run: |
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

      - name: Fix Kotlin source
        run: |
          sed -i '/^package com.example.dinocompanion/a import android.content.pm.ServiceInfo' app/src/main/java/com/example/dinocompanion/DinoOverlayService.kt

      - name: Force Java and Kotlin to JVM 17
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts
          sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK
        run: |
          gradle clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-debug
          path: app/build/outputs/apk/debug/*.apk
