name: Build Dino Companion Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -o DinoCompanion-Beta-Project.zip -d .

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > gradle.properties

      - name: Fix AndroidManifest
        run: |
          sed -i 's/ android:protectionLevel="signature|privileged|developmentTools"//' app/src/main/AndroidManifest.xml

      - name: Align Java and Kotlin JVM targets
        run: |
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' app/build.gradle.kts

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK
        run: |
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-debug
          path: app/build/outputs/apk/debug/*.apk
