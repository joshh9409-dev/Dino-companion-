name: Build Dino Companion Beta

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Dino project
        shell: bash
        run: |
          set -e
          echo 'Files in repository root:'
          ls -lah
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname 'DinoCompanion*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: DinoCompanion ZIP not found.'
            echo 'Upload the DinoCompanion project ZIP to the repository root and commit it.'
            exit 1
          fi
          echo "Using project archive: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d .
          echo 'Extracted project files:'
          ls -lah

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-debug
          path: app/build/outputs/apk/debug/*.apk
