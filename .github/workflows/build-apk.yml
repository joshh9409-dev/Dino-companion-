name: Build Dino Companion v1.32

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract newest Dino project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname 'DinoCompanion*.zip' -printf '%f\n' | sort -V | tail -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No DinoCompanion project ZIP found."
            exit 1
          fi
          echo "Using project archive: $ZIP_FILE"
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md BUILD_VERSION.txt
          unzip -o "$ZIP_FILE" -d .
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          python3 patch_v1_32.py
          rm -f app/src/main/res/layout/activity_main.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-v1.32-debug
          path: app/build/outputs/apk/debug/*.apk
