name: Dino Companion 2.0 Tamagotchi Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Tamagotchi app
        shell: bash
        run: |
          set -euo pipefail
          test -f DinoCompanion-v1.31-FullyInteractive.zip
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md BUILD_VERSION.txt
          unzip -o DinoCompanion-v1.31-FullyInteractive.zip -d .
          python3 patch_tamagotchi.py
          test -f BUILD_VERSION.txt
          grep -q 'CARE MENU' app/src/main/java/com/example/dinocompanion/MainActivity.kt
          grep -q 'EGG' app/src/main/java/com/example/dinocompanion/DinoLife.kt
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
      - name: Build APK
        run: gradle assembleDebug --stacktrace
      - name: Verify APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-2.0-Tamagotchi
          path: app/build/outputs/apk/debug/app-debug.apk
