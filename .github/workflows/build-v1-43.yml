name: Dino Companion v1.44 Complete Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract v1.31 base and generate v1.44
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="DinoCompanion-v1.31-FullyInteractive.zip"
          test -f "$ZIP_FILE"
          rm -rf app build.gradle.kts settings.gradle.kts gradle.properties README.md BUILD_VERSION.txt
          unzip -o "$ZIP_FILE" -d .
          python3 patch_v1_41.py
          grep -q 'applicationId = "com.example.dinocompanion.v143"' app/build.gradle.kts
          grep -q 'versionName = "1.44"' app/build.gradle.kts
          test -f app/src/main/java/com/example/dinocompanion/MainActivity.kt
          test -f app/src/main/java/com/example/dinocompanion/DinoOverlayService.kt

      - name: Gradle 8.11
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build complete APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/debug/*.apk
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v1.44 APK
        uses: actions/upload-artifact@v4
        with:
          name: DinoCompanion-v1.44-COMPLETE
          path: app/build/outputs/apk/debug/app-debug.apk
